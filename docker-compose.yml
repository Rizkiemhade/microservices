services:
  product-service:
    build: ./product-services
    ports:
      - "3000:3000"
    environment:
      DB_HOST: product-db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: productdb
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  cart-service:
    build: ./cart-service
    ports:
      - "3001:3001"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:3001
      DB_CONNECTION: pgsql
      DB_HOST: cart-db
      DB_PORT: 5432
      DB_DATABASE: cartdb
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword
      PRODUCT_SERVICE_URL: http://product-service:3000
      PRODUCT_SERVICE_TIMEOUT: 5
      PRODUCT_SERVICE_CONNECT_TIMEOUT: 2
      LOG_CHANNEL: stderr
    depends_on:
      cart-db:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$context = stream_context_create(["http" => ["timeout" => 2]]);
          exit(@file_get_contents("http://127.0.0.1:3001/up", false, $$context) === false ? 1 : 0);'
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  cart-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d cartdb"]
      interval: 10s
      retries: 5
      timeout: 5s

  review-service:
    build:
      context: ./review-service
      dockerfile: dockerfile
    ports:
      - "3002:3002"
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      FLASK_DEBUG: "0"
      MONGO_URI: mongodb://appuser:apppassword@review-db:27017/?authSource=admin
      MONGO_DB_NAME: reviewdb
      PRODUCT_SERVICE_URL: http://product-service:3000
    depends_on:
      review-db:
        condition: service_healthy
      product-service:
        condition: service_healthy

  review-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: appuser
      MONGO_INITDB_ROOT_PASSWORD: apppassword
    volumes:
      - review-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  order-service:
    build: ./order-service
    ports:
      - "3003:3003"
    environment:
      APP_NAME: Order Service
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:3003
      DB_CONNECTION: mysql
      DB_HOST: order-db
      DB_PORT: 3306
      DB_DATABASE: ordersdb
      DB_USERNAME: orderuser
      DB_PASSWORD: orderpassword
      CART_SERVICE_URL: http://cart-service:3001
      CART_SERVICE_TIMEOUT: 5
      CART_SERVICE_CONNECT_TIMEOUT: 2
      PRODUCT_SERVICE_URL: http://product-service:3000
      PRODUCT_SERVICE_TIMEOUT: 5
      PRODUCT_SERVICE_CONNECT_TIMEOUT: 2
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    depends_on:
      order-db:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$context = stream_context_create(["http" => ["timeout" => 2]]);
          exit(@file_get_contents("http://127.0.0.1:3003/health", false, $$context) === false ? 1 : 0);'
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  order-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ordersdb
      MYSQL_USER: orderuser
      MYSQL_PASSWORD: orderpassword
      MYSQL_ROOT_PASSWORD: orderrootpassword
    ports:
      - "3308:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uorderuser -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  product-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-services/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  product-db-data:
  cart-db-data:
  order-db-data:
  review-db-data:
